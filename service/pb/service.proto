syntax = "proto3";

option go_package = "../pb";

service Service {

    rpc ModifyServer(ModifyServerParams) returns (ModifyServerResult);
    rpc ListServers(ListServersParams) returns (ListServersResult);
    rpc ServerInfo(ServerInfoParams) returns (ServerInfoResult);

}


message ModifyServerParams{
    string key = 1;
    optional string url = 2;
}

message ModifyServerResult{}

message ListServersParams{}

message ListServersResult{
    message Server {
        string key = 1;
        string url = 2;
    }
    repeated Server servers = 1;
}

message ServerInfoParams{
    string url = 1; 
    optional string account = 2;
}

message ServerInfoResult{
    message Rate {
        string sub =1 ;
        string div = 2;
        string mul  = 3;
        string add = 4;
    }
    string version = 1;
    int64 uptime = 2;
    int64 conns = 3;
    int64 subs = 4;
    string chain = 5;
    int64 height = 6;
    string rate_feed = 7;
    string account = 8;
    string balance = 9;
    string gas_price = 10;
    Rate rate = 11;
}
