syntax = "proto3";

option go_package = "../pb";

service Service {

    rpc ListPends(ListPendsParams) returns (ListPendsResult);

    rpc ListSubs(ListSubsParams) returns (ListSubsResult);

    rpc SubmitTx(SubmitTxParams) returns (SubmitTxResult);

    rpc CheckTx(CheckTxParams) returns (CheckTxResult);

    rpc ModifyAccount(ModifyAccountParams) returns (ModifyAccountResult);

    rpc ListAccounts(ListAccountsParams) returns (ListAccountsResult);

    rpc ModifyServer(ModifyServerParams) returns (ModifyServerResult);

    rpc ListServers(ListServersParams) returns (ListServersResult);

    rpc ServerInfo(ServerInfoParams) returns (ServerInfoResult);

}



message ListSubsParams{
    string address = 1;
    string server = 2;
}

message ListSubsResult{
    message Sub {
        string tx = 1;
        int64 expire = 2;
        int64 remain = 3;
    }
    repeated Sub subs = 1;
}

message SubmitTxParams {
    bytes tx = 1;
    string server = 2;
}

message SubmitTxResult {
    string hash = 1;   
}

message CheckTxParams {
    string hash = 1;
    string server = 2;
}

message CheckTxResult {
    enum TxStatus {
        Done = 0;
        NotFound = 1;
        Pend = 2;
    }
    TxStatus status = 1;
}

message ListPendsParams{}

message ListPendsResult{
    message Tx {
        string hash = 1;
        string server = 2;
    }
    repeated Tx txs = 1;
}

message ModifyAccountParams{
    string address = 1;
    optional bytes cipher = 2;
}

message ModifyAccountResult{}

message ListAccountsParams{
    bool ciphers = 1;
}

message ListAccountsResult{
    message Account {
        string address = 1;
        optional bytes cipher = 2;
    }
    repeated Account accounts = 1;
}

message ModifyServerParams{
    string key = 1;
    optional string url = 2;
}

message ModifyServerResult{}

message ListServersParams{}

message ListServersResult{
    message Server {
        string key = 1;
        string url = 2;
    }
    repeated Server servers = 1;
}

message ServerInfoParams{
    string url = 1; 
    optional string account = 2;
}

message ServerInfoResult{
    message Rate {
        string sub =1 ;
        string div = 2;
        string mul  = 3;
        string add = 4;
    }
    string version = 1;
    int64 uptime = 2;
    int64 conns = 3;
    int64 subs = 4;
    string chain = 5;
    int64 height = 6;
    string rate_feed = 7;
    string account = 8;
    string balance = 9;
    string gas_price = 10;
    Rate rate = 11;
}
