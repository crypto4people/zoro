syntax = "proto3";

option go_package = "../pb";

service Service {
    rpc Connect(ConnectRequest) returns (ConnectResult);

    rpc Disconnect(DisconnectRequest) returns (DisconnectResult);

    rpc Stats(StatsRequest) returns (StatsResult);

    rpc ListPends(ListPendsParams) returns (ListPendsResult);

    rpc ListSubs(ListSubsParams) returns (ListSubsResult);

    rpc SubmitTx(SubmitTxParams) returns (SubmitTxResult);

    rpc CheckTx(CheckTxParams) returns (CheckTxResult);

    rpc ModifyAccount(ModifyAccountParams) returns (ModifyAccountResult);

    rpc ListAccounts(ListAccountsParams) returns (ListAccountsResult);

    rpc GetAccount(GetAccountParams) returns (GetAccountResult);

    rpc ModifyServer(ModifyServerParams) returns (ModifyServerResult);

    rpc ListServers(ListServersParams) returns (ListServersResult);

    rpc ServerInfo(ServerInfoParams) returns (ServerInfoResult);
}


message ConnectRequest {
    string name = 1;
}

message ConnectResult {
    bool ok = 1;
}

message DisconnectRequest {}

message DisconnectResult {
    bool ok = 1;
}

message StatsRequest {}

message StatsResult {
    int64 time = 1;
    int64 connections = 2;
    int64 total_bytes = 3;
    string server = 4;
}

message ListSubsParams{
    string address = 1;
    string server = 2;
}

message ListSubsResult{
    message Sub {
        string tx = 1;
        int64 expire = 2;
        int64 remain = 3;
    }
    repeated Sub subs = 1;
}

message SubmitTxParams {
    bytes tx = 1;
    string server = 2;
}

message SubmitTxResult {
    string hash = 1;   
}

message CheckTxParams {
    string hash = 1;
    string server = 2;
}

message CheckTxResult {
    enum TxStatus {
        Done = 0;
        NotFound = 1;
        Pend = 2;
    }
    TxStatus status = 1;
}

message ListPendsParams{}

message ListPendsResult{
    message Tx {
        string hash = 1;
        string server = 2;
    }
    repeated Tx txs = 1;
}

message ModifyAccountParams{
    string address = 1;
    bytes cipher = 2;
}

message ModifyAccountResult{}

message ListAccountsParams{}

message ListAccountsResult{
    repeated string accounts = 1;
}

message GetAccountParams{
    string account = 1;
}

message GetAccountResult{
    bytes cipher = 1;
}

message ModifyServerParams{
    string key = 1;
    string url = 2; // optional
}

message ModifyServerResult{}

message ListServersParams{}

message ListServersResult{
    message Server {
        string key = 1;
        string url = 2;
    }
    repeated Server servers = 1;
}

message ServerInfoParams{
    string url = 1; 
    string account = 2; // optional
}

message ServerInfoResult{
    message Rate {
        string sub =1 ;
        string div = 2;
        string mul  = 3;
        string add = 4;
    }
    string version = 1;
    int64 uptime = 2;
    int64 conns = 3;
    int64 subs = 4;
    string chain = 5;
    int64 height = 6;
    string rate_feed = 7;
    string account = 8;
    string gas_price = 9;
    Rate rate = 10;
}

message BalanceParams {
    string account = 1;
}

message BalanceResult {
    string balance = 1;
}
